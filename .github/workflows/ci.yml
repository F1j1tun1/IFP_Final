name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and simulate complete games
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Verify the Pages release build
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Publish-Pages.ps1
