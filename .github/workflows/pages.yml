name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify the project
        shell: pwsh
        run: ./scripts/Test.ps1
      - uses: actions/configure-pages@v5
      - name: Package the game
        shell: pwsh
        run: ./scripts/Publish-Pages.ps1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
