name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and simulate complete games
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Verify the Pages release build
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/Publish-Pages.ps1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Package the release
        shell: pwsh
        run: ./scripts/Publish-Pages.ps1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-results
          path: |
            artifacts/browser-results.json
            artifacts/screenshots
